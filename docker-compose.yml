services:
  db:
    image: postgres:17-alpine
    container_name: librus-db
    environment:
      POSTGRES_USER: librus
      POSTGRES_PASSWORD: librus
      POSTGRES_DB: librus
    ports:
      - "5533:5432"
    volumes:
      - librus-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librus -d librus"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  librus-pgdata:
